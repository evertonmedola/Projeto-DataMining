[project]
name = "cloudcast"
version = "1.0.0"
description = "Previsão de consumo e custo de infraestrutura cloud (CRISP-DM + MLOps)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/pipeline.py", "src/graficos.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008", "B905"]
