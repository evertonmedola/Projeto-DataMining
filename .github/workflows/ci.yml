name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests dashboard

      - name: Pipeline de ponta a ponta (dados -> modelo registrado)
        env:
          CLOUDCAST_DISABLE_MLFLOW: "1"
        run: python -m src.pipeline --rapido

      - name: Testes com cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Métricas do modelo
        run: cat outputs/metricas.json

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t cloudcast:ci .
      - name: Smoke test da API dentro do container
        run: |
          docker run -d --name api -p 8000:8000 cloudcast:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf "localhost:8000/forecast?horizonte=7" | head -c 400
